# Line chart for time series. Use when showing trends over time.
components:
- id: monkey_sightings
  type: chart
  api: demo
  highchartsData:
    chart:
      type: line
    title:
      text: Three-Headed Monkey Sightings per Month
    xAxis:
      type: category
    yAxis:
      title:
        text: Sightings
    series:
    - name: Sightings
      color: "#2E7D32"
      data:
        x: "$monkeys.data.month"
        y: "$monkeys.data.sightings"
