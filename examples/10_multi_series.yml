# Multiple series from the same data source. Use for comparison charts.
# Each series maps different fields from the same rows.
components:
- id: grog_vs_rum
  type: chart
  api: demo
  highchartsData:
    chart:
      type: column
    title:
      text: Grog vs Rum Sales at the SCUMM Bar
    colors: ["#8B4513", "#DAA520"]
    legend:
      enabled: true
    series:
    - name: Grog (pints)
      data:
        x: "$sales.data.month"
        y: "$sales.data.grog"
    - name: Rum (shots)
      data:
        x: "$sales.data.month"
        y: "$sales.data.rum"
