# Computed fields with conditional coloring. Use when you need per-row logic.
# Arguments bind $references to JS variables. Code is a JS expression.
components:
- id: computed_example
  type: chart
  api: demo
  computed:
  - name: color
    arguments:
      val: "$scores.data.score"
    code: 'val > 80 ? "#2E7D32" : val > 50 ? "#F57F17" : "#C62828"'
  - name: label
    arguments:
      name: "$scores.data.name"
      val: "$scores.data.score"
    code: 'name + " (" + val + "%)"'
  highchartsData:
    chart:
      type: bar
    title:
      text: Performance Scores
    plotOptions:
      bar:
        colorByPoint: true
    series:
    - name: Score
      data:
        x: "$label"
        y: "$scores.data.score"
        color: "$color"
