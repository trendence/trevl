# Simple bar chart. Use when you want horizontal bars comparing categories.
components:
- id: rum_consumption
  type: chart
  api: demo
  highchartsData:
    chart:
      type: bar
    title:
      text: Annual Rum Consumption by Pirate (Barrels)
    colors: ["#8B4513"]
    series:
    - name: Rum (barrels)
      data:
        x: "$pirates.data.name"
        y: "$pirates.data.barrels"
