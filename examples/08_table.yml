# Data table with columns. Use when you need tabular output instead of charts.
components:
- id: crew_manifest
  type: table
  api: demo
  tableData:
    headers: ["Pirate", "Role", "Grog Ration"]
    columns:
    - identifier: pirate
      value: "$crew.data.name"
    - identifier: role
      value: "$crew.data.role"
    - identifier: grog
      value: "$crew.data.grog_ration"
