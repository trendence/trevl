# Template inheritance. Register a template first, then reference it.
# Component values override template values at the same path (deep merge).
#
# Ruby setup:
#   Trevl.template_store.register("pirate_bar", {
#     "highchartsData" => {
#       "chart" => {"type" => "bar"},
#       "colors" => ["#8B4513", "#DAA520"],
#       "plotOptions" => {"bar" => {"borderRadius" => 6}},
#       "credits" => {"enabled" => false}
#     }
#   })
components:
- id: plunder_template
  type: chart
  api: demo
  template: pirate_bar
  highchartsData:
    title:
      text: Plunder by Ship (uses pirate_bar template)
    series:
    - name: Plunder
      data:
        x: "$ships.data.ship"
        y: "$ships.data.plunder"
