# Score component for a single KPI value. Use for dashboards with key numbers.
components:
- id: crew_morale
  type: score
  api: demo
  display:
    value: "$morale.data.score"
    unit: "%"
    header:
      title: Crew Morale
    format:
      minimumFractionDigits: 0
      maximumFractionDigits: 0
