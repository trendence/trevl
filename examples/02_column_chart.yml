# Vertical column chart. Use for comparing values across categories side by side.
components:
- id: treasure_haul
  type: chart
  api: demo
  highchartsData:
    chart:
      type: column
    title:
      text: Treasure Haul by Quarter (Doubloons)
    colors: ["#DAA520"]
    plotOptions:
      column:
        borderRadius: 4
    series:
    - name: Doubloons
      data:
        x: "$loot.data.quarter"
        y: "$loot.data.doubloons"
