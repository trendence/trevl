# Pie chart for proportions. Use when showing parts of a whole.
components:
- id: mutiny_vote
  type: chart
  api: demo
  highchartsData:
    chart:
      type: pie
    title:
      text: Mutiny Board Election Results
    series:
    - name: Votes
      data:
        name: "$candidates.data.candidate"
        y: "$candidates.data.votes"
